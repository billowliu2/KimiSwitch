    <!--
      Theme bootstrap. Runs before the first paint so the page never flashes
      the wrong palette: read the stored preference (same key and vocabulary
      as the desktop app), resolve it against the OS, and set the class on
      <html>. Kept inline and dependency-free on purpose.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("kimi-switch-theme");
          var mode = stored === "light" || stored === "dark" || stored === "auto" ? stored : "auto";
          var dark = mode === "dark" ||
            (mode === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.remove("light", "dark");
          root.classList.add(dark ? "dark" : "light");
          var meta = document.getElementById("theme-color");
          if (meta) meta.setAttribute("content", dark ? "#101216" : "#fafafb");
        } catch (e) {
          /* private mode / disabled storage: fall through to the light default */
        }
      })();
    </script>
