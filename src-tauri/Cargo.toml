[package]
name = "kimiswitch"
version = "0.7.9"
description = "Kimi Switch - model config manager"
authors = ["codingplan.site"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-opener = "2.0.0"
tauri-plugin-single-instance = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2.2", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
regex = "1"
walkdir = "2"
fs_extra = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
futures-util = "0.3"
dirs = "5.0"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
tokio = { version = "1", features = ["sync", "fs", "io-util"] }
# Plugin marketplace: zip extraction (deflate-only; no extra compression
# backends needed for plugin archives).
zip = { version = "2", default-features = false, features = ["deflate"] }
# Scoped OAuth credential keys (oauth/kimi-code-env-<sha256>) for non-mainland
# regions, mirroring the official CLI's resolveKimiCodeOAuthKey.
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[lib]
name = "kimiswitch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
